# 应用名称
spring.application.name=java_community_backend

# 服务器端口配置
server.port=7070

# 数据库配置（MySQL）
# 注意：请根据你的实际情况修改数据库名、用户名和密码
spring.datasource.url=jdbc:mysql://localhost:3306/final?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=root
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA配置
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

# Spring Security 已启用，通过 SecurityConfig 配置访问规则

# JWT配置
